name: Build Contracts & Generate Dart Types

on:
  push:
    paths:
      - 'packages/typescript/signaling-contract/contracts/**'
      - 'packages/typescript/signaling-contract/hardhat.config.ts'
      - 'packages/typescript/signaling-contract/package.json'
      - '.github/workflows/build-contracts.yml'
    branches:
      - main
      - develop
  pull_request:
    paths:
      - 'packages/typescript/signaling-contract/contracts/**'
      - 'packages/typescript/signaling-contract/hardhat.config.ts'
      - 'packages/typescript/signaling-contract/package.json'
  workflow_dispatch:

jobs:
  build-and-generate:
    name: Build Contracts & Generate Dart Types
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'packages/typescript/signaling-contract/package-lock.json'

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install Melos
        run: dart pub global activate melos

      - name: Melos bootstrap
        run: melos bootstrap

      - name: Install TypeScript dependencies
        working-directory: packages/typescript/signaling-contract
        run: npm ci

      - name: Build Contracts
        working-directory: packages/typescript/signaling-contract
        run: npm run build

      - name: Verify generated Dart files
        working-directory: packages/contract_sdk
        run: |
          dart pub get
          dart analyze

      - name: Check for changes
        id: verify-changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request (if changes)
        if: steps.verify-changes.outputs.has_changes == 'true' && github.event_name == 'push'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: regenerate contract bindings'
          title: 'chore: regenerate contract bindings'
          body: |
            Automatically generated Dart bindings from updated smart contracts.
            
            **Changes:**
            - Updated TypeChain types
            - Regenerated Dart SDK bindings
            
            Please review and merge if everything looks correct.
          branch: auto/regenerate-bindings
          delete-branch: true
          assignees: lgualandi

      - name: Validate consistency
        run: |
          echo "✅ Contracts built successfully"
          echo "✅ Dart bindings generated"
          echo "✅ All types synchronized"
