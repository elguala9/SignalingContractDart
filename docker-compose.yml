services:
  # EVM Ganache - Standalone Ethereum test network for integration tests
  ganache:
    image: trufflesuite/ganache:latest
    container_name: parresia-contract-ganache
    ports:
      - "8545:8545"
    command:
      - --mnemonic=test test test test test test test test test test test junk
      - --defaultBalanceEther=1000
      - --accounts=20
      - --chain.chainId=1337
      - --chain.hardfork=shanghai
      - --server.host=0.0.0.0
    environment:
      - GANACHE_DETERMINISTIC=true
    networks:
      - contract-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const h=require('http');const r=h.request({hostname:'localhost',port:8545,method:'POST',headers:{'Content-Type':'application/json'}},s=>{process.exit(s.statusCode===200?0:1)});r.write('{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}');r.end();r.on('error',()=>process.exit(1));\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    labels:
      description: "Ganache instance for Signaling Contract integration tests"

networks:
  contract-network:
    driver: bridge
    name: parresia-contract-network
