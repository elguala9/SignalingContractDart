services:
  # EVM Ganache - Standalone Ethereum test network
  evm:
    image: trufflesuite/ganache:latest
    container_name: contract-evm
    ports:
      - "7545:8545"
    command:
      - --mnemonic=test test test test test test test test test test test junk
      - --defaultBalanceEther=10000
      - --accounts=20
      - --chain.chainId=1337
      - --hardfork=london
      - --gasPrice=0
    environment:
      - GANACHE_DETERMINISTIC=true
    networks:
      - contract-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8545"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

networks:
  contract-network:
    driver: bridge
    name: contract-blockchain-network
