name: contract_monorepo
repository: https://github.com/yourusername/contract

packages:
  - packages/**

command:
  bootstrap:
    environment:
      sdk: ">=3.0.0 <4.0.0"
      
scripts:
  # === BUILD & GENERATION PIPELINE ===
  
  contracts:build:
    description: Build TypeScript contracts and generate Dart bindings
    run: |
      cd packages/typescript/signaling-contract && npm run build
      cd ../../contract_sdk && dart pub get
    
  contracts:build:typechain:
    description: Build TypeScript contracts and generate TypeChain types
    run: cd packages/typescript/signaling-contract && npm run build:typechain
    
  contracts:build:dart:
    description: Generate only Dart bindings from existing artifacts
    run: cd packages/typescript/signaling-contract && npm run build:dart
  
  # === UTILITY SCRIPTS ===
  
  analyze:
    description: Analyze all packages
    run: melos exec -- "dart analyze ."
    
  test:
    description: Run all tests
    run: melos exec -- "dart test"
    
  format:
    description: Format all packages
    run: melos exec -- "dart format ."
    
  get:
    description: Get dependencies for all packages
    run: melos exec -- "dart pub get"
  
  # === DEVELOPMENT WORKFLOW ===
  
  dev:setup:
    description: Setup development environment (install deps, build contracts, generate types)
    run: |
      cd packages/typescript/signaling-contract && npm install
      cd ../../contract_sdk && dart pub get
      melos run contracts:build
    
  clean:
    description: Clean all build artifacts
    run: |
      cd packages/typescript/signaling-contract && npx hardhat clean
      cd ../../contract_sdk && rm -rf .dart_tool build
