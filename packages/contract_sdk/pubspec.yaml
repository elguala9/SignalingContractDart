name: signaling_contract_sdk
description: Type-safe Dart SDK for blockchain signaling smart contracts with auto-generated bindings, Ethereum/EVM support, and comprehensive deployment utilities.
version: 1.0.1
homepage: https://github.com/gualandi/parresia-contract
repository: https://github.com/gualandi/parresia-contract
issue_tracker: https://github.com/gualandi/parresia-contract/issues
documentation: https://pub.dev/documentation/signaling_contract_sdk/latest/

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  http: ^1.1.0
  web3dart: ^3.0.1
  convert: ^3.1.1
  wallet: ^0.0.14

dev_dependencies:
  test: ^1.24.0
  lints: ^3.0.0

topics:
  - blockchain
  - ethereum
  - smart-contracts
  - web3
  - evm
